name: ci

on:
  push:
  pull_request:

jobs:
  unit-tests:
    name: unit tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r script-server/requirements.txt
          python -m pip install pytest httpx

      - name: byte-compile executor
        run: python -m py_compile script-server/script_server.py

      - name: unit tests
        run: python -m pytest script-server/tests -q

  offline-verifiers:
    # 不依赖真实端口的离线验收：日志分级/轮转。跑在 Windows 上，与生产同构。
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install deps
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r script-server/requirements.txt
      - name: logging acceptance
        working-directory: script-server
        run: python deploy/verify-logging.py
